<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1b1440">
<title>GachiGacha</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d0a24;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{background:radial-gradient(circle at 20% 10%,#3a2a7a 0,transparent 40%),radial-gradient(circle at 90% 70%,#5a1f6a 0,transparent 45%),#0d0a24}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
header h1{font-size:20px;margin:0;letter-spacing:1px;background:linear-gradient(90deg,#ffd86b,#ff7ad9,#7af0ff);-webkit-background-clip:text;color:transparent}
.pill{background:#ffffff1a;border-radius:20px;padding:5px 11px;font-size:14px;font-weight:600}
main{flex:1;overflow-y:auto;padding:0 12px 12px}
nav{display:flex;background:#170f3a;border-top:1px solid #ffffff18;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:#aab;padding:9px 0 7px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:21px}
nav button.on{color:#ffd86b}
.card{background:#ffffff10;border:1px solid #ffffff14;border-radius:18px;padding:12px;margin:10px 0}
.stage{position:relative;height:250px;border-radius:18px;overflow:hidden;background:linear-gradient(#24185a,#3b2477);display:flex;align-items:flex-end;justify-content:center}
.stage svg.pet{width:190px;height:190px;margin-bottom:12px;animation:bob 2.4s ease-in-out infinite}
.stage.sleep{filter:brightness(.55)}
.stage.sleep svg.pet{animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) scale(1.03,.97)}}
.ground{position:absolute;bottom:0;left:0;right:0;height:38px;background:#ffffff14;border-radius:50% 50% 0 0/30px 30px 0 0}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.7}
.bub{position:absolute;top:12px;left:12px;right:12px;font-size:13px;text-align:center;opacity:.9}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.tabs button{flex:0 0 auto;border:1px solid #ffffff22;background:#ffffff0d;color:#fff;border-radius:14px;padding:5px 9px;display:flex;align-items:center;gap:5px;font-size:13px}
.tabs button.on{border-color:#ffd86b;background:#ffd86b22}
.tabs svg{width:28px;height:28px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px 14px;font-size:12px}
.bar{height:8px;background:#ffffff1a;border-radius:6px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:6px;transition:width .4s}
.acts{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.acts button,.btn{border:0;border-radius:14px;padding:10px 4px;font-size:12px;color:#fff;background:linear-gradient(#6b4bd6,#4a2fa8);box-shadow:0 3px 0 #2a1a6a;font-weight:600}
.acts button b{display:block;font-size:22px}
.acts button:active,.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #2a1a6a}
.btn{padding:11px 16px;font-size:15px}
.btn.gold{background:linear-gradient(#ffcf4a,#f08a1c);box-shadow:0 3px 0 #9a4c00;color:#3a1d00}
.btn.ghost{background:#ffffff18;box-shadow:none}
button:disabled{opacity:.4}
.muted{color:#b9b3dd;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{background:#ffffff0d;border-radius:12px;padding:4px;text-align:center;font-size:10px;position:relative}
.cell svg{width:100%;height:auto}
.r-common{border:2px solid #9aa3b8}.r-rare{border:2px solid #4aa8ff}.r-epic{border:2px solid #c56bff}.r-legendary{border:2px solid #ffc94a;box-shadow:0 0 10px #ffc94a88}
.tag{display:inline-block;border-radius:8px;padding:1px 7px;font-size:11px;font-weight:700}
.t-common{background:#9aa3b8;color:#222}.t-rare{background:#4aa8ff;color:#022}.t-epic{background:#c56bff}.t-legendary{background:#ffc94a;color:#331}
.row{display:flex;gap:10px;align-items:center}
.alum{display:flex;gap:10px;align-items:center;background:#ffffff0d;border-radius:14px;padding:8px;margin:7px 0}
.alum svg{width:56px;height:56px;flex:0 0 auto}
.alum .f{margin-left:auto;font-size:24px;background:none;border:0;color:#666}
.alum .f.on{color:#ffd86b}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
#modal .box{background:#1f1650;border-radius:22px;padding:16px;max-width:440px;width:100%;max-height:90vh;overflow:auto;text-align:center;border:1px solid #ffffff22}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#ffd86b;color:#331;padding:7px 14px;border-radius:14px;font-weight:700;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:10}
.machine{width:200px;margin:0 auto;display:block}
.shake{animation:shake .12s linear infinite}
@keyframes shake{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.pop{animation:pop .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.speed button{border:1px solid #ffffff33;background:none;color:#fff;border-radius:10px;padding:6px 10px;margin:2px}
.speed button.on{background:#ffd86b;color:#331}
.float{position:absolute;font-size:24px;animation:fl 1.1s ease-out forwards;pointer-events:none}
@keyframes fl{to{transform:translateY(-70px);opacity:0}}
h3{margin:4px 0 8px}
/* ---- v2 animation layer ---- */
.stage{touch-action:pan-y}
.stage.mode{touch-action:none}
#walker{position:absolute;left:50%;bottom:10px;width:170px;height:170px;margin-left:-85px;will-change:transform;z-index:2}
#flip{width:100%;height:100%;transition:transform .25s}
.petbox{position:relative;width:100%;height:100%;transform-origin:50% 92%}
.stage .petbox svg.pet{width:100%;height:100%;margin:0;animation:none}
.petbox .mouthO{opacity:0}
.petbox .eyes{transform-box:fill-box;transform-origin:center;transition:transform .2s}
.m-happy{animation:hb 1.1s ease-in-out infinite}
@keyframes hb{50%{transform:translateY(-6px) scale(1.03,.97)}}
.m-sad{animation:droop 3.2s ease-in-out infinite}
@keyframes droop{50%{transform:translateY(4px) scale(1.04,.93) rotate(-2deg)}}
.m-sick{animation:wob 1.4s ease-in-out infinite;filter:saturate(.6) hue-rotate(40deg)}
@keyframes wob{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.m-sleep{animation:breathe 3.5s ease-in-out infinite;transform:scale(1.08,.8)}
@keyframes breathe{0%,100%{transform:scale(1.08,.8) rotate(-4deg)}50%{transform:scale(1.12,.76) rotate(-4deg)}}
.m-egg{animation:eggw 1.6s ease-in-out infinite}
.m-egg.e2{animation-duration:.7s}.m-egg.e3{animation-duration:.28s}
@keyframes eggw{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(0)}}
.petbox .crack{opacity:0;transition:opacity .4s}.e3 .crack{opacity:1}
/* one-shot idles override mood anim */
.petbox.i-blink .eyes{transform:scaleY(.1)}
.petbox.i-lookL .eyes{transform:translateX(-8px)}.petbox.i-lookR .eyes{transform:translateX(8px)}
.petbox.i-bounce{animation:ibounce .7s ease-out 2}
@keyframes ibounce{30%{transform:translateY(-28px) scale(.95,1.06)}60%{transform:translateY(0) scale(1.1,.88)}}
.petbox.i-stretch{animation:istr 1.4s ease-in-out}
@keyframes istr{40%,60%{transform:scale(.9,1.18)}}
.petbox.i-spin{animation:ispin .8s ease-in-out}
@keyframes ispin{to{transform:rotate(360deg)}}
.petbox.i-sit{animation:isit 2s ease-in-out}
@keyframes isit{20%,80%{transform:scale(1.1,.82)}}
.petbox.giggle{animation:gig .12s linear 6}
@keyframes gig{25%{transform:rotate(-5deg) scale(1.04,.96)}75%{transform:rotate(5deg) scale(.96,1.04)}}
.petbox.chomp{animation:chomp .22s ease-in-out 4}
.petbox.chomp .mouthO,.petbox.chompo .mouthO{opacity:1}.petbox.chomp .mouth,.petbox.chompo .mouth{opacity:0}
@keyframes chomp{50%{transform:scale(1.08,.9)}}
.petbox.yuck{animation:gig .15s linear 5;filter:hue-rotate(70deg) saturate(.7)}
.petbox.yuck .mouth{opacity:0}
.petbox.perk{animation:ibounce .6s ease-out 1;filter:brightness(1.25)}
.petbox.pop{animation:pop .7s cubic-bezier(.3,1.8,.5,1)}
.petbox.flinch{animation:gig .1s linear 4;filter:brightness(1.5)}
#dirt{position:absolute;inset:18% 18% 8% 18%;border-radius:50%;pointer-events:none;opacity:0;
 background:radial-gradient(circle at 30% 40%,#5a3a1acc 0 9%,transparent 10%),radial-gradient(circle at 65% 30%,#6b4a20bb 0 7%,transparent 8%),radial-gradient(circle at 55% 70%,#4a3010cc 0 11%,transparent 12%),radial-gradient(circle at 25% 75%,#6b4a20aa 0 6%,transparent 7%),radial-gradient(circle at 78% 60%,#5a3a1aaa 0 8%,transparent 9%)}
#fxl{position:fixed;inset:0;pointer-events:none;z-index:12;overflow:hidden}
.pt{position:absolute;left:0;top:0;font-size:22px;will-change:transform,opacity;pointer-events:none;margin:-14px 0 0 -12px}
.pt.float{animation:fl 1.1s ease-out forwards;font-size:24px}
.pt.heart{animation:hrt 1.1s ease-out forwards}
@keyframes hrt{to{transform:translate(var(--dx),-80px) scale(1.4);opacity:0}}
.pt.burst{animation:bst .7s ease-out forwards;font-size:14px}
@keyframes bst{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}
.pt.bubble{width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#9ef 40%,#7af0ff55 70%);border:1px solid #fff9;animation:bbl 1s ease-out forwards;margin:0}
@keyframes bbl{to{transform:translate(var(--dx),-40px) scale(1.4);opacity:0}}
.pt.zz{animation:zz 2.4s ease-out forwards;font-weight:800;color:#cde}
@keyframes zz{to{transform:translate(40px,-90px) scale(1.6);opacity:0}}
.pt.half{animation:half 1s ease-in forwards;margin:0}
@keyframes half{to{transform:translate(var(--dx),60px) rotate(var(--r));opacity:0}}
.pt.flash{width:240px;height:240px;margin:-120px;border-radius:50%;background:radial-gradient(#fff,#ffd86b88 40%,transparent 70%);animation:flash .6s ease-out forwards}
@keyframes flash{from{transform:scale(.2)}to{transform:scale(1.3);opacity:0}}
.curtain{position:fixed;pointer-events:none;z-index:11;border-radius:18px;background:#05031a;animation:curt 1.4s ease-in-out forwards}
@keyframes curt{0%{opacity:0}45%{opacity:.85}100%{opacity:0}}
.dragg{position:fixed;left:0;top:0;font-size:44px;z-index:13;pointer-events:none;margin:-26px 0 0 -24px;filter:drop-shadow(0 4px 6px #0008)}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;display:none;padding:12px 14px calc(14px + env(safe-area-inset-bottom));background:#1f1650f2;border-top:1px solid #ffffff30;border-radius:20px 20px 0 0;max-width:480px;margin:0 auto;text-align:center;animation:slup .25s ease-out}
@keyframes slup{from{transform:translateY(100%)}}
#sheet .items{display:flex;gap:8px;justify-content:center;margin:8px 0}
#sheet .it{flex:1;max-width:100px;background:#ffffff14;border:1px solid #ffffff22;border-radius:14px;padding:8px 2px;font-size:11px;touch-action:none;user-select:none;-webkit-user-select:none}
#sheet .it b{display:block;font-size:34px}
#sheet .it small{color:#b9b3dd}
.prog{height:10px;background:#ffffff1a;border-radius:6px;overflow:hidden;margin:6px 0}.prog i{display:block;height:100%;width:0;background:#7af0ff;transition:width .15s}
#game{position:fixed;inset:0;z-index:11;display:none;background:radial-gradient(circle at 50% 20%,#3a2a7a,#0d0a24 70%);flex-direction:column;max-width:480px;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
#game .gh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-weight:700}
#game .ga{position:relative;flex:1;overflow:hidden}
.gpet{position:absolute;width:90px;height:90px;will-change:transform}
.gpet svg{width:100%;height:100%}
.fall{position:absolute;left:0;top:0;font-size:30px;will-change:transform;margin:-18px 0 0 -16px}
.pickc{display:flex;gap:10px;align-items:center;text-align:left;background:#ffffff12;border-radius:16px;padding:10px;margin:8px 0;border:1px solid #ffffff22;width:100%;color:#fff;font-size:13px}
.pickc b{font-size:15px}.pickc .e{font-size:36px}
.pads{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px 16px 150px}
.pad{border-radius:50%;border:4px solid #ffffff44;opacity:.45;transition:opacity .1s,transform .1s;aspect-ratio:1;align-self:center;justify-self:center;width:min(100%,160px)}
.pad.lit{opacity:1;transform:scale(1.08);box-shadow:0 0 30px currentColor}
.holes{position:absolute;inset:0 0 120px 0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px;padding:10px}
.hole{position:relative;border-radius:50%;background:radial-gradient(#000a,#ffffff10 70%);overflow:hidden}
.hole .mt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:52px;transform:translateY(100%);transition:transform .12s}
.hole .mt.up{transform:none}
.big{font-size:44px;font-weight:800;margin:6px 0}
/* ---- v3 ---- */
.traits{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{background:#ffffff14;border:1px solid #ffffff26;border-radius:12px;padding:3px 8px;font-size:11.5px;color:#fff}
.chip.big2{font-size:13px;padding:6px 10px}
.deco{position:absolute;transform:translateX(-50%);z-index:1;pointer-events:none;line-height:1;filter:drop-shadow(0 3px 3px #0007);user-select:none;-webkit-user-select:none}
.deco.fly{animation:dfly 4s ease-in-out infinite}
@keyframes dfly{50%{translate:0 -6px}}
.deco.rug{width:130px;height:30px;border-radius:50%;opacity:.9;z-index:0;filter:none}
.deco-edit .deco{pointer-events:auto;outline:2px dashed #ffd86baa;outline-offset:2px;border-radius:10px;touch-action:none;cursor:grab}
.deco-edit #walker{pointer-events:none;opacity:.55}
.stage .ground{z-index:0}
.shopi{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid #ffffff10}
.shopi .e{font-size:32px;width:44px;text-align:center}
.swatch{display:inline-block;width:40px;height:16px;border-radius:50%}
.walls{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:6px}
.wall{border:2px solid #ffffff22;border-radius:12px;height:70px;color:#fff;font-size:11px;font-weight:700;text-shadow:0 1px 3px #000;display:flex;align-items:flex-end;justify-content:center;padding:4px}
.wall.on{border-color:#ffd86b;box-shadow:0 0 10px #ffd86b88}
.quest{display:flex;gap:10px;align-items:center;background:#ffffff0d;border-radius:14px;padding:8px;margin:7px 0;text-align:left}
.quest .e{font-size:26px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}
.cd{background:#ffffff10;border-radius:10px;padding:5px 1px;font-size:10px;text-align:center;border:1px solid #ffffff1a}
.cd b{display:block;font-size:18px}.cd small{display:block;color:#b9b3dd;font-size:9px}
.cd.got{opacity:.5;background:#8dff8a22}.cd.now{border-color:#ffd86b;box-shadow:0 0 8px #ffd86b88}
.tog{border:1px solid #ffffff33;background:#ffffff14;color:#fff;border-radius:14px;padding:6px 14px;font-weight:700;min-width:60px}
.tog.on{background:#8dff8a;color:#032}
nav button{position:relative;font-size:10px}nav button b{font-size:19px}
nav button.dot::after{content:"";position:absolute;top:6px;right:22%;width:9px;height:9px;border-radius:50%;background:#ff4d6d;box-shadow:0 0 6px #ff4d6d}
.rground{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#8a86b8,#4a4680);border-top:3px solid #c9c6ef;border-radius:30% 30% 0 0/20px 20px 0 0}
.lane{position:absolute;top:0;bottom:0;border-right:1px solid #ffffff14}
.lpad{position:absolute;left:12%;right:12%;height:40px;border:3px solid;border-radius:20px;opacity:.5;transition:opacity .1s,transform .1s}
.lpad.lit{opacity:1;transform:scale(1.1);background:#ffffff33}
.hline{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,#ff7ad9,#ffd86b,#7af0ff);box-shadow:0 0 12px #fff}
.bmsg{position:absolute;width:100%;text-align:center;font-weight:800;font-size:20px}
.bmsg.pop{animation:pop .4s cubic-bezier(.3,1.8,.5,1)}
/* ---- v4 ---- */
nav button{font-size:11.5px}nav button b{font-size:21px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mcard{background:#ffffff10;border:1px solid #ffffff1f;border-radius:18px;color:#fff;padding:18px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.mcard b{font-size:36px}.mcard span{font-weight:700;font-size:15px}.mcard small{color:#b9b3dd;font-size:11px}
.back{background:none;border:0;color:#ffd86b;font-weight:700;font-size:14px;padding:8px 2px 0}
.banner{background:linear-gradient(135deg,#ff7ad933,#ffd86b22 60%,#7af0ff22)}
.pity{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px;text-align:left;margin-top:10px}
.eggb{background:#ffffff10;border:1px solid #ffffff22;border-radius:12px;padding:2px;width:52px;height:52px}.eggb svg{width:100%;height:100%}
.pchip{display:flex;align-items:center;gap:4px;background:#ffffff10;border:2px solid #ffffff22;border-radius:14px;color:#fff;padding:3px 8px 3px 3px;font-size:12px;text-align:left}
.pchip svg{width:40px;height:40px}.pchip small{display:block;color:#b9b3dd;font-size:10px}.pchip.on{border-color:#ff7ad9;background:#ff7ad933}
.chip.hyb{background:linear-gradient(90deg,#ff7ad966,#7af0ff66)}
.nl{animation:nl 1.5s ease-in-out}.nr{animation:nr 1.5s ease-in-out}
@keyframes nl{50%{transform:translateX(25px) rotate(8deg)}}@keyframes nr{50%{transform:translateX(-25px) rotate(-8deg)}}
.mailbtn{display:flex;align-items:center;gap:8px;width:100%;color:#fff;font-size:15px;text-align:left}
.postcard{position:relative;border-radius:16px;min-height:220px;padding:16px;text-align:left;overflow:hidden;border:6px solid #fff;box-shadow:0 6px 20px #0008}
.postcard .stamp{position:absolute;right:10px;top:10px;width:76px;height:76px;background:#fff3;border:3px dashed #fff;border-radius:8px}
.postcard .stamp svg{width:100%;height:100%}
.pctext{position:relative;margin-top:84px;font-size:14px;line-height:1.4;font-style:italic;text-shadow:0 1px 3px #0009}
.hs{margin-left:auto;text-align:center;font-size:12px;color:#ffd86b;font-weight:700;min-width:34px}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{background:#ffffff0a;border:1px solid #ffffff1a;border-radius:14px;color:#fff;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;opacity:.55}
.badge.on{opacity:1;border-color:#ffd86b88;background:#ffd86b14}
.badge b{font-size:28px}.badge span{font-size:11px;font-weight:700}.badge small{font-size:10px;color:#b9b3dd}
/* ---- v5 ---- */
.celest{position:absolute;transform:translate(-50%,-50%);z-index:0;pointer-events:none}
.sun{width:44px;height:44px;border-radius:50%;background:radial-gradient(#fff6c0,#ffd86b 60%,#ffb30000 72%);box-shadow:0 0 30px #ffd86b}
.moon1{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#cfd3ff);box-shadow:0 0 18px #cfd3ff99}
.moon2{position:absolute;left:38px;top:-12px;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe0f5,#ff7ad9)}
.ph-day .star{opacity:.12!important}.ph-dawn .star,.ph-dusk .star{opacity:.35!important}
.wxbar{position:absolute;left:8px;right:8px;top:34px;font-size:11px;background:#0007;border-radius:10px;padding:3px 8px;text-align:center;z-index:3}
.wxfx{position:absolute;inset:0;pointer-events:none;z-index:0}
.wx-meteor .wxfx{background:linear-gradient(200deg,transparent 45%,#fff8 49%,transparent 51%) 0 0/120px 120px;animation:met 1.2s linear infinite;opacity:.5}
@keyframes met{to{background-position:-120px 120px}}
.wx-aurora .wxfx{background:linear-gradient(170deg,transparent 10%,#5affc855 30%,#b28bff44 45%,transparent 60%);animation:aur 6s ease-in-out infinite alternate}

  const tl={curl:`<path d="M150 135 C185 135 185 95 165 100" stroke="${c2}" stroke-width="10" fill="none" stroke-linecap="round"/>`,
   spike:`<path d="M148 130 L190 120 L150 148Z" fill="${c2}"/>`,
   fluff:`<circle cx="160" cy="138" r="16" fill="${c2}"/>`,
   comet:`<path d="M150 130 Q185 110 195 70 Q175 120 152 145Z" fill="${c2}" opacity=".85"/><circle cx="195" cy="70" r="5" fill="#fff"/>`}[s.tail]||"";
  if(stage>=2) p.push(tl);
  // legs
  if(s.legs) p.push(`<ellipse cx="78" cy="160" rx="13" ry="9" fill="${c2}"/><ellipse cx="122" cy="160" rx="13" ry="9" fill="${c2}"/>`);
  // ears
  const er={cat:`<path d="M60 70 L62 30 L90 55Z M140 70 L138 30 L110 55Z" fill="${c1}"/>`,
   round:`<circle cx="62" cy="55" r="17" fill="${c1}"/><circle cx="138" cy="55" r="17" fill="${c1}"/><circle cx="62" cy="55" r="8" fill="${c2}"/><circle cx="138" cy="55" r="8" fill="${c2}"/>`,
   fin:`<path d="M45 100 L15 80 L42 125Z M155 100 L185 80 L158 125Z" fill="${c2}"/>`}[s.ears]||"";
  p.push(er);
  // antenna
  const an={one:`<path d="M100 45 Q105 20 100 12" stroke="${c2}" stroke-width="4" fill="none"/><circle cx="100" cy="12" r="7" fill="${c2}"/>`,
   two:`<path d="M85 48 L72 15 M115 48 L128 15" stroke="${c2}" stroke-width="4"/><circle cx="72" cy="15" r="6" fill="${c2}"/><circle cx="128" cy="15" r="6" fill="${c2}"/>`,
   horns:`<path d="M75 52 L70 22 L90 48Z M125 52 L130 22 L110 48Z" fill="#fff8"/>`,
   orb:`<circle cx="100" cy="14" r="8" fill="#fff" opacity=".9"><animate attributeName="cy" values="14;6;14" dur="2s" repeatCount="indefinite"/></circle>`,
   leaf:`<path d="M100 45 Q80 15 100 8 Q120 15 100 45Z" fill="#8dff8a"/>`}[s.ant]||"";
  if(stage>=1) p.push(an);
  // body
  const bodyFill = variant==="wild" ? `url(#w${uid})` : `url(#b${uid})`;
  p.push(`<defs><radialGradient id="b${uid}" cx=".35" cy=".3"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset=".35" stop-color="${c1}"/><stop offset="1" stop-color="${c1}"/></radialGradient>
   <pattern id="w${uid}" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="${c1}"/><path d="M0 14 L7 0 L14 14" fill="${c2}" opacity=".35"/></pattern></defs>`);
  p.push(`<path d="${bodyPath(s.body)}" fill="${bodyFill}" stroke="#0003" stroke-width="3"/>`);
  // marks
  if(s.marks==="spots") p.push(`<circle cx="70" cy="85" r="7" fill="${c2}" opacity=".7"/><circle cx="135" cy="100" r="9" fill="${c2}" opacity=".7"/><circle cx="125" cy="140" r="5" fill="${c2}" opacity=".7"/>`);
  if(s.marks==="stripe") p.push(`<path d="M60 100 Q100 90 140 100" stroke="${c2}" stroke-width="8" fill="none" opacity=".6"/>`);
  if(s.marks==="belly") p.push(`<ellipse cx="100" cy="135" rx="28" ry="20" fill="#fff" opacity=".35"/>`);
  // eyes
  const ey=95, n=s.eyes, xs=n===1?[100]:n===2?[80,120]:[74,100,126];
  const sleep=mood==="sleep";
  p.push('<g class="eyes">');
  xs.forEach((x,i)=>{ const yy=n===3&&i===1?ey-14:ey;
    if(sleep){p.push(`<path d="M${x-9} ${yy} Q${x} ${yy+7} ${x+9} ${yy}" stroke="#222" stroke-width="3" fill="none"/>`);return;}
    const R=s.eyeStyle==="big"?13:s.eyeStyle==="dot"?7:10;
    if(s.eyeStyle==="sleepy"){p.push(`<ellipse cx="${x}" cy="${yy}" rx="10" ry="6" fill="#fff"/><circle cx="${x}" cy="${yy+1}" r="4" fill="#222"/>`);}
    else{p.push(`<circle cx="${x}" cy="${yy}" r="${R}" fill="#fff"/><circle cx="${x+1}" cy="${yy+1}" r="${R*.6}" fill="#222"/><circle cx="${x+3}" cy="${yy-3}" r="${R*.22}" fill="#fff"/>`);
      if(s.eyeStyle==="sparkle") p.push(`<path d="M${x-3} ${yy+3} l2 -2 l2 2 l-2 2z" fill="#fff"/>`);}
  });
  p.push('</g>');
  // mouth
  const my=125;p.push('<g class="mouth">');
  if(sleep) p.push(`<text x="140" y="60" font-size="22" fill="#fff">z</text><text x="155" y="40" font-size="16" fill="#fff">z</text>`);
  else if(mood==="sad") p.push(`<path d="M88 ${my+6} Q100 ${my-4} 112 ${my+6}" stroke="#222" stroke-width="3" fill="none" stroke-linecap="round"/>`);
  else if(mood==="sick") p.push(`<path d="M88 ${my} q6 -5 12 0 q6 5 12 0" stroke="#3a6" stroke-width="3" fill="none"/><circle cx="68" cy="115" r="6" fill="#7c7" opacity=".6"/>`);
  else p.push(`<path d="M86 ${my} Q100 ${my+14} 114 ${my}" stroke="#222" stroke-width="3" fill="#ff8aa8" stroke-linecap="round"/>`);
  p.push(`</g><ellipse class="mouthO" cx="100" cy="128" rx="13" ry="11" fill="#5a1030"/>`);
  p.push(`<ellipse cx="68" cy="113" rx="8" ry="5" fill="#ff7a9a" opacity=".45"/><ellipse cx="132" cy="113" rx="8" ry="5" fill="#ff7a9a" opacity=".45"/>`);
  if(variant==="radiant") p.push(`<path d="M100 2 l4 10 l10 2 l-10 3 l-4 10 l-4 -10 l-10 -3 l10 -2z" fill="#ffd86b"/>`);
  if(variant==="wild") p.push(`<path d="M60 50 l-8 -10 M140 50 l8 -10" stroke="${c2}" stroke-width="4"/>`);
  p.push(`</g>`);
  return `<svg class="${cls||''}" viewBox="0 0 200 200">${p.join("")}</svg>`;
}

// ---------- STATE ----------
const KEY="gachigacha_v1";
const STATS=["hunger","happy","energy","clean","health"];
const STAT_UI={hunger:["🍖","Fullness","#ff9f5a"],happy:["💖","Happiness","#ff7ad9"],energy:["⚡","Energy","#ffd86b"],clean:["🫧","Clean","#7af0ff"],health:["❤️‍🩹","Health","#8dff8a"]};
// decay per game hour
const DECAY={hunger:4.5,happy:3.5,energy:3,clean:2.5};
let S;
function fresh(){return{stars:30,pets:[],alumni:[],dex:{},speed:1,last:Date.now(),gameNow:Date.now(),nextId:1,pulls:0,maxPets:3}}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
  if(!S){S=fresh();S.pets.push(newPet(0,true));S.dex[0]=1;}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function newPet(spId){const sp=SPECIES[spId];const r=Math.random;
  return{id:S?S.nextId++:0,sp:spId,nick:sp.name,born:S?S.gameNow:Date.now(),
    life:sp.life*DAY*(0.85+r()*0.3), hunger:80,happy:80,energy:90,clean:90,health:100,
    sleeping:false,care:0,careN:0,variant:null,stage:0,lastAct:{},hatchAt:Date.now()+60000}}
// ---------- SIM ----------
function stageOf(p){if(p.stage===0&&Date.now()<(p.hatchAt||0))return 0;const f=(S.gameNow-p.born)/p.life;let st=1;STAGE_AT.forEach((a,i)=>{if(i>0&&f>=a)st=i});return st}
function step(p,dtH){ // advance pet by dtH game hours
  if(p.stage===0){return}
  const sleepMul=p.sleeping?.35:1;
  p.hunger=Math.max(0,p.hunger-DECAY.hunger*dtH*sleepMul);
  p.happy=Math.max(0,p.happy-DECAY.happy*dtH*sleepMul);
  p.clean=Math.max(0,p.clean-DECAY.clean*dtH);
  if(p.sleeping){p.energy=Math.min(100,p.energy+14*dtH);if(p.energy>=100)p.sleeping=false}
  else p.energy=Math.max(0,p.energy-DECAY.energy*dtH);
  const low=["hunger","happy","clean","energy"].filter(k=>p[k]<20).length;
  if(low) p.health=Math.max(5,p.health-low*2.2*dtH); // never dies
  else if(p.health<100) p.health=Math.min(100,p.health+.8*dtH);
  // care quality sample
  const q=(p.hunger+p.happy+p.energy+p.clean+p.health)/5;
  p.care+=q*dtH;p.careN+=dtH;
}
function quality(p){return p.careN?p.care/p.careN:75}
function tick(){
  const now=Date.now();let dReal=Math.min(now-S.last,400*DAY);S.last=now;
  let dGame=dReal*S.speed;
  // simulate in chunks of <=1 game hour
  while(dGame>0){const ch=Math.min(dGame,HOUR);S.gameNow+=ch;dGame-=ch;
    for(const p of S.pets){step(p,ch/HOUR);checkStage(p);}
  }
}
function checkStage(p){const st=stageOf(p);
  if(st!==p.stage){
    const old=p.stage;p.stage=st;
    if(st===1&&old===0) notes.push(`🥚 ${p.nick} hatched!`);
    else if(st===3&&!p.variant){const q=quality(p);p.variant=q>=72?"radiant":q>=45?"classic":"wild";notes.push(`✨ ${p.nick} evolved into a ${VARIANTS[p.variant].n} ${STAGES[st]}!`)}
    else notes.push(`🌱 ${p.nick} grew into a ${STAGES[st]}!`);
    if(p.stage>=3&&!p.variant)p.variant="classic";
  }
  if(S.gameNow-p.born>=p.life && !p.ready){p.ready=true;notes.push(`🚀 ${p.nick} is all grown up and ready to move out!`)}
}
let notes=[];
function mood(p){if(p.sleeping)return"sleep";if(p.health<40)return"sick";if(Math.min(p.hunger,p.happy,p.clean)<25)return"sad";return"happy"}

// ---------- ACTIONS ----------
let cur=0,tab="home";
function act(kind,food){const p=S.pets[cur];if(!p)return;
  if(p.stage===0){toast("Still an egg... keep it warm! 🥚");return}
  if(p.sleeping&&kind!=="sleep"){toast(p.nick+" is sleeping 💤");return}
  let need=0,emo="";
  if(kind==="feed"){need=100-p.hunger;const fd=food||{hunger:30,clean:-4};for(const k in fd)if(k in p&&STATS.includes(k))p[k]=Math.max(0,Math.min(100,p[k]+fd[k]));emo=(food&&food.e)||"🍩"}
  if(kind==="play"){if(p.energy<15){toast("Too tired to play!");return}need=100-p.happy;p.happy=Math.min(100,p.happy+25);p.energy-=12;p.hunger=Math.max(0,p.hunger-5);emo="🎾"}
  if(kind==="sleep"){p.sleeping=!p.sleeping;emo=p.sleeping?"💤":"☀️";need=p.sleeping?100-p.energy:0}
  if(kind==="clean"){need=100-p.clean;p.clean=100;emo="🫧"}
  if(kind==="med"){if(p.health>85){toast(p.nick+" feels fine — no medicine needed");p.happy=Math.max(0,p.happy-5);refresh();return false}need=100-p.health;p.health=Math.min(100,p.health+40);emo="💊"}
  // stars: reward real care, cooldown per action (game time)
  const lastT=p.lastAct[kind]||0;
  if(need>=20&&S.gameNow-lastT>HOUR*.5){const g=need>=50?2:1;S.stars+=g;floatTxt("+"+g+"⭐");}
  p.lastAct[kind]=S.gameNow;
  floatTxt(emo);save();refresh();return true;
}
function floatTxt(t){const st=document.querySelector(".stage");if(!st)return;const r=st.getBoundingClientRect();particle(t,r.left+r.width*(.35+Math.random()*.3),r.top+r.height*.4,"float")}
function toast(t){const e=$("toast");e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,1900)}
function outcome(p){const q=quality(p),sp=SPECIES[p.sp],r=rng(p.id*99+p.sp);
  const great=["opened a cozy café on a ring-moon","became a famous nebula painter","leads star-gazing tours for baby comets","runs a sanctuary for lost space-kittens","composes symphonies for passing starships","is a beloved teacher at the Cosmic Academy"];
  const good=["built a little dome-home by a crater lake","works as a friendly asteroid miner","joined a traveling space circus","grows glow-berries on a quiet farm planet","pilots a cargo shuttle between moons"];
  const ok=["is finding its way, drifting between planets","lives in a messy but happy asteroid shack","took a job counting stars (it loses count a lot)","is roaming the outer rings on an adventure"];
  return q>=72?{tier:"🌟 Thriving",txt:pick(r,great)}:q>=45?{tier:"😊 Happy",txt:pick(r,good)}:{tier:"🌀 Independent",txt:pick(r,ok)};}
function moveOut(){const p=S.pets[cur];if(!p||!p.ready)return;
  const o=outcome(p);
  const a={id:p.id,sp:p.sp,nick:p.nick,variant:p.variant||"classic",q:Math.round(quality(p)),tier:o.tier,job:o.txt,left:S.gameNow,leftReal:Date.now(),fav:false};
  S.alumni.unshift(a);S.pets.splice(cur,1);cur=0;
  const bonus=10+Math.round(a.q/5);S.stars+=bonus;save();
  modal(`<h2>🚀 Farewell, ${a.nick}!</h2>${petSVG(SPECIES[a.sp],4,a.variant,"happy","pop")}<p><b>${a.tier}</b><br>${a.nick} ${a.job}.</p><p class="muted">Care score ${a.q}/100 · +${bonus}⭐ graduation gift</p><button class="btn gold" onclick="closeM();tab='alumni';render()">Visit Alumni</button>`);
}
// ---------- GACHA ----------
const COST=10,COST10=90;
function roll(){let t=Math.random()*100,acc=0,rar="common";
  for(const k of ["legendary","epic","rare","common"]){acc+=RAR[k].w;if(t<acc){rar=k;break}}
  const pool=SPECIES.filter(s=>s.rarity===rar);return pick(Math.random,pool)}
function pull(n){const cost=n===10?COST10:COST;
  if(S.stars<cost){toast("Not enough stars! Care for your pets ⭐");return}
  const slots=S.maxPets-S.pets.length;
  if(slots<1){toast("Nest is full (3 pets). Raise one to adulthood first!");return}
  n=Math.min(n,slots); if(n===1&&cost===COST10)return;
  S.stars-=n===1?COST:cost;
  const got=[];for(let i=0;i<n;i++){const sp=roll();got.push(sp);const isNew=!S.dex[sp.id];S.dex[sp.id]=(S.dex[sp.id]||0)+1;sp._new=isNew;S.pets.push(newPet(sp.id))}
  S.pulls+=n;save();
  // animation
  modal(`<h2>Summoning...</h2><svg class="machine shake" viewBox="0 0 200 200">${machine()}</svg>`);
  setTimeout(()=>{modal(`<h2>You got${got.length>1?"…":"!"}</h2>`+got.map(sp=>`<div class="card pop"><div class="row">${petSVG(sp,0,null,"happy").replace('<svg','<svg style="width:70px"')}<div style="text-align:left"><span class="tag t-${sp.rarity}">${sp.rarity.toUpperCase()}</span> ${sp._new?'<span class="tag" style="background:#8dff8a;color:#032">NEW!</span>':''}<br><b>${sp.name} egg</b><div class="muted">${sp.flavor}</div></div></div></div>`).join("")+`<button class="btn gold" onclick="closeM();tab='home';cur=S.pets.length-1;render()">To the nest!</button>`)},1300);
}
function machine(){return `<rect x="50" y="20" width="100" height="100" rx="45" fill="#7af0ff55" stroke="#fff" stroke-width="4"/><circle cx="80" cy="70" r="14" fill="#ff7ad9"/><circle cx="115" cy="60" r="12" fill="#ffd86b"/><circle cx="105" cy="92" r="13" fill="#8dff8a"/><circle cx="78" cy="98" r="10" fill="#c56bff"/><rect x="45" y="110" width="110" height="70" rx="14" fill="#ff5a8a"/><circle cx="100" cy="142" r="15" fill="#ffd86b" stroke="#a40" stroke-width="3"/><rect x="88" y="165" width="24" height="10" rx="3" fill="#311"/>`}

// ---------- ALUMNI ----------
function alumniUpdate(a){const r=rng(a.id*31+Math.floor((S.gameNow-a.left)/DAY));
  const days=Math.floor((S.gameNow-a.left)/DAY);
  const ev=["just sent you a postcard from a pink ring-planet 💌","made a new best friend named "+pick(r,SPECIES).name+" 👯","is redecorating with moon-crystals 💎","learned to cook nebula noodles 🍜","won a zero-G dance-off 🕺","is napping in a hammock between two moons 😴","adopted a tiny pet asteroid 🪨","says it misses your belly rubs 🥹","planted a garden of glow-flowers 🌸","is training for the Comet Marathon 🏃"];
  return {days,txt:pick(r,ev)};}
function visit(id){const a=S.alumni.find(x=>x.id===id);if(!a)return;const sp=SPECIES[a.sp];const u=alumniUpdate(a);const r=rng(a.id);
  const sky=pick(r,["#2b1a5e,#c0487a","#0f2a5e,#2fb3a5","#3b1450,#ff9a5a","#123,#5a3fbf"]);

function hug(id){const a=S.alumni.find(x=>x.id===id);const k="hug"+id;const day=Math.floor(S.gameNow/DAY);
  if(a.hugDay!==day){a.hugDay=day;S.stars+=1;save();toast("💞 "+a.nick+" sent love back! +1⭐")}else toast("💞 "+a.nick+" already got a hug today")}
const MAXFAV=10;
function fav(id){const a=S.alumni.find(x=>x.id===id);if(!a.fav&&S.alumni.filter(x=>x.fav).length>=MAXFAV){toast("Max "+MAXFAV+" favorites");return}a.fav=!a.fav;save();render()}

function starsHTML(n){let h="";const r=rng(n*7);for(let i=0;i<n;i++)h+=`<i class="star" style="left:${r()*100}%;top:${r()*70}%;opacity:${.3+r()*.7}"></i>`;return h}

$("modal").onclick=e=>{if(e.target.id==="modal")closeM()};

  <div class="muted" id="info" style="margin-top:4px">${p.ready?"Ready to move out!":p.stage===0?"Hatching in "+Math.max(0,Math.ceil(((p.hatchAt||0)-Date.now())/1000))+"s":p.stage<4?"Next stage ("+STAGES[p.stage+1]+") in "+fmtDur(nextStage):"Moves out in "+fmtDur(nextStage)}</div>

  <div class="muted" style="margin-top:8px">Care quality: <b id="cq">${Math.round(quality(p))}</b>/100 ${p.stage<3?"(decides its evolution at Teen)":""}</div>`:`<p class="muted">${sp.flavor}</p>`}</div>
  ${p.ready?`<button class="btn gold" style="width:100%;margin-bottom:10px" onclick="moveOut()">🚀 Help ${p.nick} move out!</button>`:""}
  <div class="acts">${[["feed","🍩","Feed"],["play","🎾","Play"],["sleep",p.sleeping?"☀️":"💤",p.sleeping?"Wake":"Sleep"],["clean","🫧","Clean"],["med","💊","Medicine"]].map(([k,e,l])=>`<button onclick="care('${k}')" ${p.stage===0?'disabled':''}><b>${e}</b>${l}</button>`).join("")}</div>`;
}
function rename(){const p=S.pets[cur];const n=prompt("Name your pet:",p.nick);if(n&&n.trim()){p.nick=n.trim().slice(0,14);save();render()}}

function loop(){requestAnimationFrame(loop);const wk=$("walker");if(tab!=="home"||!wk)return;const p=S.pets[cur];if(!p)return;
  const t=now(),st=wk.parentElement,lim=Math.max(0,(st.clientWidth-170)/2-6),m=mood(p),pb=$("petbox");
  if(!W._dt)W._dt=t;const dt=Math.min(.05,(t-W._dt)/1000);W._dt=t;let y=0;

    if(W.state==="walk"){const sp=(m==="happy"?65:m==="sick"?22:18)*(p.stage===1?1.25:1),d=W.tx-W.x,mv=Math.sign(d)*Math.min(Math.abs(d),sp*dt);

      else{let pool=m==="happy"?IDLES:["i-lookL","i-lookR","i-sit","i-stretch"];W.idle=pick(Math.random,pool);
        W.idleEnd=t+({"i-bounce":1400,"i-stretch":1400,"i-spin":800,"i-sit":2000}[W.idle]||1200);pb&&pb.classList.add(W.idle);

function sfx(n,arg){if(!AC||!S.audio.sfx)return;const t=performance.now();if(t-(sfxLast[n]||0)<(n==="bubble"?70:40))return;sfxLast[n]=t;

const PROG=[[0,4,7],[-3,0,4],[-7,-3,0],[-5,-1,2]],PENTA=[0,2,4,7,9,12,14,16,19,21];
function musicStart(){if(!AC||musTimer)return;musT=AC.currentTime+.15;musStep=0;musTimer=setInterval(musSched,150)}

function musSched(){if(!AC||AC.state!=="running")return;const B=.45;
  while(musT<AC.currentTime+.7){const at=Math.max(0,musT-AC.currentTime),bar=Math.floor(musStep/8)%4,st=musStep%8;
    if(st===0)PROG[bar].forEach(s=>tone(N(s),B*8.5,{type:"sine",v:.045,dest:MuG,at,att:.6}));
    if(st===0||st===4)tone(N(PROG[bar][0]-12),B*3.5,{type:"sine",v:.05,dest:MuG,at,att:.1});
    if(Math.random()<(st%2?.35:.8)){musDeg=clamp(musDeg+pick(Math.random,[-2,-1,-1,0,1,1,2]),0,PENTA.length-1);
      tone(N(PENTA[musDeg]+12),B*1.8,{type:"triangle",v:.05,dest:MuG,at,att:.04});
      if(Math.random()<.15)tone(N(PENTA[musDeg]+36),.4,{type:"sine",v:.015,dest:MuG,at:at+B/2})}
    musT+=B;musStep++}}
