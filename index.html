 background:radial-gradient(circle at 30% 40%,#5a3a1acc 0 9%,transparent 10%),radial-gradient(circle at 65% 30%,#6b4a20bb 0 7%,transparent 8%),radial-gradient(circle at 55% 70%,#4a3010cc 0 11%,transparent 12%),radial-gradient(circle at 25% 75%,#6b4a20aa 0 6%,transparent 7%),radial-gradient(circle at 78% 60%,#5a3a1aaa 0 8%,transparent 9%)}

<div id="app">

<script>
"use strict";
// ---------- RNG ----------
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296}}
function hash(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const pick=(r,a)=>a[Math.floor(r()*a.length)];
const $=id=>document.getElementById(id);
const HOUR=3600e3,DAY=24*HOUR;

// ---------- SPECIES ----------
const RAW=[
// name, rarity, lifespan days, flavor
["Blorbit","common",30,"A jelly drifter from the Moons of Plop. Wobbles when happy."],
["Zibzab","common",28,"Hums in two-tone chirps. Loves shiny pebbles."],
["Glimmop","common",30,"Its skin sparkles faintly under starlight."],
["Pufflux","common",32,"Inflates like a balloon when surprised."],
["Nebbly","common",30,"Born inside a tiny nebula cloud. Smells like rain."],
["Squoodle","common",26,"Has soft noodle-limbs and endless curiosity."],
["Tumbot","common",30,"Half moss, half moonrock. Rolls instead of walks."],
["Fizzle","common",14,"Lives fast and fizzy! Grows up in a flash."],

const RAR={common:{w:62,c:"#9aa3b8",stars:1},rare:{w:26,c:"#4aa8ff",stars:2},epic:{w:10,c:"#c56bff",stars:3},legendary:{w:2,c:"#ffc94a",stars:5}};

const STAGE_AT=[0,0,.18,.42,.70]; // fraction of lifespan
const VARIANTS={radiant:{n:"Radiant",d:"Raised with tons of love: glowing and confident."},classic:{n:"Classic",d:"A balanced, happy upbringing."},wild:{n:"Wild",d:"A bit scruffy and independent."}};

function bodyPath(t){return{
 blob:"M100 40 C150 40 165 90 160 125 C155 165 45 165 40 125 C35 90 50 40 100 40Z",
 round:"M100 45 A62 62 0 1 1 99.9 45Z",
 tall:"M70 40 Q100 20 130 40 L145 150 Q100 170 55 150Z",
 bean:"M60 60 C80 30 150 35 155 90 C160 150 120 165 85 155 C45 145 40 90 60 60Z",
 star:"M100 35 L118 80 L165 85 L130 115 L142 160 L100 138 L58 160 L70 115 L35 85 L82 80Z",
 ghost:"M50 160 L50 90 C50 45 150 45 150 90 L150 160 L133 145 L117 160 L100 145 L83 160 L67 145Z",

 drop:"M100 30 C125 70 160 95 155 130 C150 165 50 165 45 130 C40 95 75 70 100 30Z"}[t]}
function petSVG(sp,stage,variant,mood,cls){
  stage=stage|0; let s=sp;
  if(stage===0){ // egg
    return `<svg class="${cls||''}" viewBox="0 0 200 200"><defs><radialGradient id="eg${s.id}" cx=".35" cy=".3"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="${s.c1}"/></radialGradient></defs>
    <ellipse cx="100" cy="175" rx="45" ry="8" fill="#0004"/><path d="M100 35 C140 35 155 110 150 135 C145 170 55 170 50 135 C45 110 60 35 100 35Z" fill="url(#eg${s.id})" stroke="${RAR[s.rarity].c}" stroke-width="4"/>
    <circle cx="80" cy="100" r="9" fill="${s.c2}"/><circle cx="118" cy="125" r="12" fill="${s.c2}"/><circle cx="112" cy="75" r="6" fill="${s.c2}"/><path class="crack" d="M58 105 L75 96 L86 110 L100 94 L113 112 L126 98 L143 108" stroke="#3a2a5a" stroke-width="4" fill="none" stroke-linejoin="round"/></svg>`;}
  const sc=[0,.62,.78,.9,1][stage];
  let c1=s.c1,c2=s.c2,glow="";
  if(variant==="radiant") glow=`<circle cx="100" cy="100" r="88" fill="${c1}" opacity=".18"/><circle cx="100" cy="100" r="70" fill="#fff" opacity=".08"/>`;
  const uid="g"+s.id+"_"+stage+(variant||"");
  let p=[];
  p.push(`<ellipse cx="100" cy="172" rx="${50*sc}" ry="8" fill="#0005"/>`);
  p.push(`<g transform="translate(100 168) scale(${sc}) translate(-100 -168)">`);
  p.push(glow);
  // tail
  const tl={curl:`<path d="M150 135 C185 135 185 95 165 100" stroke="${c2}" stroke-width="10" fill="none" stroke-linecap="round"/>`,
   spike:`<path d="M148 130 L190 120 L150 148Z" fill="${c2}"/>`,
   fluff:`<circle cx="160" cy="138" r="16" fill="${c2}"/>`,
   comet:`<path d="M150 130 Q185 110 195 70 Q175 120 152 145Z" fill="${c2}" opacity=".85"/><circle cx="195" cy="70" r="5" fill="#fff"/>`}[s.tail]||"";
  if(stage>=2) p.push(tl);
  // legs
  if(s.legs) p.push(`<ellipse cx="78" cy="160" rx="13" ry="9" fill="${c2}"/><ellipse cx="122" cy="160" rx="13" ry="9" fill="${c2}"/>`);
  // ears
  const er={cat:`<path d="M60 70 L62 30 L90 55Z M140 70 L138 30 L110 55Z" fill="${c1}"/>`,
   round:`<circle cx="62" cy="55" r="17" fill="${c1}"/><circle cx="138" cy="55" r="17" fill="${c1}"/><circle cx="62" cy="55" r="8" fill="${c2}"/><circle cx="138" cy="55" r="8" fill="${c2}"/>`,
   fin:`<path d="M45 100 L15 80 L42 125Z M155 100 L185 80 L158 125Z" fill="${c2}"/>`}[s.ears]||"";
  p.push(er);
  // antenna
  const an={one:`<path d="M100 45 Q105 20 100 12" stroke="${c2}" stroke-width="4" fill="none"/><circle cx="100" cy="12" r="7" fill="${c2}"/>`,
   two:`<path d="M85 48 L72 15 M115 48 L128 15" stroke="${c2}" stroke-width="4"/><circle cx="72" cy="15" r="6" fill="${c2}"/><circle cx="128" cy="15" r="6" fill="${c2}"/>`,
   horns:`<path d="M75 52 L70 22 L90 48Z M125 52 L130 22 L110 48Z" fill="#fff8"/>`,
   orb:`<circle cx="100" cy="14" r="8" fill="#fff" opacity=".9"><animate attributeName="cy" values="14;6;14" dur="2s" repeatCount="indefinite"/></circle>`,
   leaf:`<path d="M100 45 Q80 15 100 8 Q120 15 100 45Z" fill="#8dff8a"/>`}[s.ant]||"";
  if(stage>=1) p.push(an);
  // body
  const bodyFill = variant==="wild" ? `url(#w${uid})` : `url(#b${uid})`;
  p.push(`<defs><radialGradient id="b${uid}" cx=".35" cy=".3"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset=".35" stop-color="${c1}"/><stop offset="1" stop-color="${c1}"/></radialGradient>
   <pattern id="w${uid}" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="${c1}"/><path d="M0 14 L7 0 L14 14" fill="${c2}" opacity=".35"/></pattern></defs>`);
  p.push(`<path d="${bodyPath(s.body)}" fill="${bodyFill}" stroke="#0003" stroke-width="3"/>`);
  // marks
  if(s.marks==="spots") p.push(`<circle cx="70" cy="85" r="7" fill="${c2}" opacity=".7"/><circle cx="135" cy="100" r="9" fill="${c2}" opacity=".7"/><circle cx="125" cy="140" r="5" fill="${c2}" opacity=".7"/>`);
  if(s.marks==="stripe") p.push(`<path d="M60 100 Q100 90 140 100" stroke="${c2}" stroke-width="8" fill="none" opacity=".6"/>`);
  if(s.marks==="belly") p.push(`<ellipse cx="100" cy="135" rx="28" ry="20" fill="#fff" opacity=".35"/>`);
  // eyes
  const ey=95, n=s.eyes, xs=n===1?[100]:n===2?[80,120]:[74,100,126];
  const sleep=mood==="sleep";
  p.push('<g class="eyes">');
  xs.forEach((x,i)=>{ const yy=n===3&&i===1?ey-14:ey;
    if(sleep){p.push(`<path d="M${x-9} ${yy} Q${x} ${yy+7} ${x+9} ${yy}" stroke="#222" stroke-width="3" fill="none"/>`);return;}
    const R=s.eyeStyle==="big"?13:s.eyeStyle==="dot"?7:10;
    if(s.eyeStyle==="sleepy"){p.push(`<ellipse cx="${x}" cy="${yy}" rx="10" ry="6" fill="#fff"/><circle cx="${x}" cy="${yy+1}" r="4" fill="#222"/>`);}
    else{p.push(`<circle cx="${x}" cy="${yy}" r="${R}" fill="#fff"/><circle cx="${x+1}" cy="${yy+1}" r="${R*.6}" fill="#222"/><circle cx="${x+3}" cy="${yy-3}" r="${R*.22}" fill="#fff"/>`);
      if(s.eyeStyle==="sparkle") p.push(`<path d="M${x-3} ${yy+3} l2 -2 l2 2 l-2 2z" fill="#fff"/>`);}
  });
  p.push('</g>');
  // mouth
  const my=125;p.push('<g class="mouth">');
  if(sleep) p.push(`<text x="140" y="60" font-size="22" fill="#fff">z</text><text x="155" y="40" font-size="16" fill="#fff">z</text>`);
  else if(mood==="sad") p.push(`<path d="M88 ${my+6} Q100 ${my-4} 112 ${my+6}" stroke="#222" stroke-width="3" fill="none" stroke-linecap="round"/>`);
  else if(mood==="sick") p.push(`<path d="M88 ${my} q6 -5 12 0 q6 5 12 0" stroke="#3a6" stroke-width="3" fill="none"/><circle cx="68" cy="115" r="6" fill="#7c7" opacity=".6"/>`);
  else p.push(`<path d="M86 ${my} Q100 ${my+14} 114 ${my}" stroke="#222" stroke-width="3" fill="#ff8aa8" stroke-linecap="round"/>`);
  p.push(`</g><ellipse class="mouthO" cx="100" cy="128" rx="13" ry="11" fill="#5a1030"/>`);
  p.push(`<ellipse cx="68" cy="113" rx="8" ry="5" fill="#ff7a9a" opacity=".45"/><ellipse cx="132" cy="113" rx="8" ry="5" fill="#ff7a9a" opacity=".45"/>`);
  if(variant==="radiant") p.push(`<path d="M100 2 l4 10 l10 2 l-10 3 l-4 10 l-4 -10 l-10 -3 l10 -2z" fill="#ffd86b"/>`);
  if(variant==="wild") p.push(`<path d="M60 50 l-8 -10 M140 50 l8 -10" stroke="${c2}" stroke-width="4"/>`);
  p.push(`</g>`);
  return `<svg class="${cls||''}" viewBox="0 0 200 200">${p.join("")}</svg>`;
}

// ---------- STATE ----------
const KEY="gachigacha_v1";
const STATS=["hunger","happy","energy","clean","health"];
const STAT_UI={hunger:["🍖","Fullness","#ff9f5a"],happy:["💖","Happiness","#ff7ad9"],energy:["⚡","Energy","#ffd86b"],clean:["🫧","Clean","#7af0ff"],health:["❤️‍🩹","Health","#8dff8a"]};
// decay per game hour
const DECAY={hunger:4.5,happy:3.5,energy:3,clean:2.5};
let S;
function fresh(){return{stars:30,pets:[],alumni:[],dex:{},speed:1,last:Date.now(),gameNow:Date.now(),nextId:1,pulls:0,maxPets:3}}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
  if(!S){S=fresh();S.pets.push(newPet(0,true));S.dex[0]=1;}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function newPet(spId){const sp=SPECIES[spId];const r=Math.random;
  return{id:S?S.nextId++:0,sp:spId,nick:sp.name,born:S?S.gameNow:Date.now(),
    life:sp.life*DAY*(0.85+r()*0.3), hunger:80,happy:80,energy:90,clean:90,health:100,
    sleeping:false,care:0,careN:0,variant:null,stage:0,lastAct:{},hatchAt:Date.now()+60000}}
// ---------- SIM ----------
function stageOf(p){if(p.stage===0&&Date.now()<(p.hatchAt||0))return 0;const f=(S.gameNow-p.born)/p.life;let st=1;STAGE_AT.forEach((a,i)=>{if(i>0&&f>=a)st=i});return st}
function step(p,dtH){ // advance pet by dtH game hours
  if(p.stage===0){return}
  const sleepMul=p.sleeping?.35:1;
  p.hunger=Math.max(0,p.hunger-DECAY.hunger*dtH*sleepMul);
  p.happy=Math.max(0,p.happy-DECAY.happy*dtH*sleepMul);
  p.clean=Math.max(0,p.clean-DECAY.clean*dtH);
  if(p.sleeping){p.energy=Math.min(100,p.energy+14*dtH);if(p.energy>=100)p.sleeping=false}
  else p.energy=Math.max(0,p.energy-DECAY.energy*dtH);
  const low=["hunger","happy","clean","energy"].filter(k=>p[k]<20).length;
  if(low) p.health=Math.max(5,p.health-low*2.2*dtH); // never dies
  else if(p.health<100) p.health=Math.min(100,p.health+.8*dtH);
  // care quality sample
  const q=(p.hunger+p.happy+p.energy+p.clean+p.health)/5;
  p.care+=q*dtH;p.careN+=dtH;
}
function quality(p){return p.careN?p.care/p.careN:75}
function tick(){
  const now=Date.now();let dReal=Math.min(now-S.last,400*DAY);S.last=now;
  let dGame=dReal*S.speed;
  // simulate in chunks of <=1 game hour
  while(dGame>0){const ch=Math.min(dGame,HOUR);S.gameNow+=ch;dGame-=ch;
    for(const p of S.pets){step(p,ch/HOUR);checkStage(p);}
  }
}
function checkStage(p){const st=stageOf(p);
  if(st!==p.stage){
    const old=p.stage;p.stage=st;
    if(st===1&&old===0) notes.push(`🥚 ${p.nick} hatched!`);
    else if(st===3&&!p.variant){const q=quality(p);p.variant=q>=72?"radiant":q>=45?"classic":"wild";notes.push(`✨ ${p.nick} evolved into a ${VARIANTS[p.variant].n} ${STAGES[st]}!`)}
    else notes.push(`🌱 ${p.nick} grew into a ${STAGES[st]}!`);
    if(p.stage>=3&&!p.variant)p.variant="classic";
  }
  if(S.gameNow-p.born>=p.life && !p.ready){p.ready=true;notes.push(`🚀 ${p.nick} is all grown up and ready to move out!`)}
}
let notes=[];
function mood(p){if(p.sleeping)return"sleep";if(p.health<40)return"sick";if(Math.min(p.hunger,p.happy,p.clean)<25)return"sad";return"happy"}

// ---------- ACTIONS ----------
let cur=0,tab="home";
function act(kind,food){const p=S.pets[cur];if(!p)return;
  if(p.stage===0){toast("Still an egg... keep it warm! 🥚");return}
  if(p.sleeping&&kind!=="sleep"){toast(p.nick+" is sleeping 💤");return}
  let need=0,emo="";
  if(kind==="feed"){need=100-p.hunger;const fd=food||{hunger:30,clean:-4};for(const k in fd)if(k in p&&STATS.includes(k))p[k]=Math.max(0,Math.min(100,p[k]+fd[k]));emo=(food&&food.e)||"🍩"}
  if(kind==="play"){if(p.energy<15){toast("Too tired to play!");return}need=100-p.happy;p.happy=Math.min(100,p.happy+25);p.energy-=12;p.hunger=Math.max(0,p.hunger-5);emo="🎾"}
  if(kind==="sleep"){p.sleeping=!p.sleeping;emo=p.sleeping?"💤":"☀️";need=p.sleeping?100-p.energy:0}
  if(kind==="clean"){need=100-p.clean;p.clean=100;emo="🫧"}
  if(kind==="med"){if(p.health>85){toast(p.nick+" feels fine — no medicine needed");p.happy=Math.max(0,p.happy-5);refresh();return false}need=100-p.health;p.health=Math.min(100,p.health+40);emo="💊"}
  // stars: reward real care, cooldown per action (game time)
  const lastT=p.lastAct[kind]||0;
  if(need>=20&&S.gameNow-lastT>HOUR*.5){const g=need>=50?2:1;S.stars+=g;floatTxt("+"+g+"⭐");}
  p.lastAct[kind]=S.gameNow;
  floatTxt(emo);save();refresh();return true;
}
function floatTxt(t){const st=document.querySelector(".stage");if(!st)return;const r=st.getBoundingClientRect();particle(t,r.left+r.width*(.35+Math.random()*.3),r.top+r.height*.4,"float")}
function toast(t){const e=$("toast");e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,1900)}
function outcome(p){const q=quality(p),sp=SPECIES[p.sp],r=rng(p.id*99+p.sp);
  const great=["opened a cozy café on a ring-moon","became a famous nebula painter","leads star-gazing tours for baby comets","runs a sanctuary for lost space-kittens","composes symphonies for passing starships","is a beloved teacher at the Cosmic Academy"];
  const good=["built a little dome-home by a crater lake","works as a friendly asteroid miner","joined a traveling space circus","grows glow-berries on a quiet farm planet","pilots a cargo shuttle between moons"];
  const ok=["is finding its way, drifting between planets","lives in a messy but happy asteroid shack","took a job counting stars (it loses count a lot)","is roaming the outer rings on an adventure"];
  return q>=72?{tier:"🌟 Thriving",txt:pick(r,great)}:q>=45?{tier:"😊 Happy",txt:pick(r,good)}:{tier:"🌀 Independent",txt:pick(r,ok)};}
function moveOut(){const p=S.pets[cur];if(!p||!p.ready)return;
  const o=outcome(p);
  const a={id:p.id,sp:p.sp,nick:p.nick,variant:p.variant||"classic",q:Math.round(quality(p)),tier:o.tier,job:o.txt,left:S.gameNow,leftReal:Date.now(),fav:false};
  S.alumni.unshift(a);S.pets.splice(cur,1);cur=0;
  const bonus=10+Math.round(a.q/5);S.stars+=bonus;save();
  modal(`<h2>🚀 Farewell, ${a.nick}!</h2>${petSVG(SPECIES[a.sp],4,a.variant,"happy","pop")}<p><b>${a.tier}</b><br>${a.nick} ${a.job}.</p><p class="muted">Care score ${a.q}/100 · +${bonus}⭐ graduation gift</p><button class="btn gold" onclick="closeM();tab='alumni';render()">Visit Alumni</button>`);
}
// ---------- GACHA ----------
const COST=10,COST10=90;
function roll(){let t=Math.random()*100,acc=0,rar="common";
  for(const k of ["legendary","epic","rare","common"]){acc+=RAR[k].w;if(t<acc){rar=k;break}}
  const pool=SPECIES.filter(s=>s.rarity===rar);return pick(Math.random,pool)}
function pull(n){const cost=n===10?COST10:COST;
  if(S.stars<cost){toast("Not enough stars! Care for your pets ⭐");return}
  const slots=S.maxPets-S.pets.length;
  if(slots<1){toast("Nest is full (3 pets). Raise one to adulthood first!");return}
  n=Math.min(n,slots); if(n===1&&cost===COST10)return;
  S.stars-=n===1?COST:cost;
  const got=[];for(let i=0;i<n;i++){const sp=roll();got.push(sp);const isNew=!S.dex[sp.id];S.dex[sp.id]=(S.dex[sp.id]||0)+1;sp._new=isNew;S.pets.push(newPet(sp.id))}
  S.pulls+=n;save();
  // animation
  modal(`<h2>Summoning...</h2><svg class="machine shake" viewBox="0 0 200 200">${machine()}</svg>`);
  setTimeout(()=>{modal(`<h2>You got${got.length>1?"…":"!"}</h2>`+got.map(sp=>`<div class="card pop"><div class="row">${petSVG(sp,0,null,"happy").replace('<svg','<svg style="width:70px"')}<div style="text-align:left"><span class="tag t-${sp.rarity}">${sp.rarity.toUpperCase()}</span> ${sp._new?'<span class="tag" style="background:#8dff8a;color:#032">NEW!</span>':''}<br><b>${sp.name} egg</b><div class="muted">${sp.flavor}</div></div></div></div>`).join("")+`<button class="btn gold" onclick="closeM();tab='home';cur=S.pets.length-1;render()">To the nest!</button>`)},1300);
}
function machine(){return `<rect x="50" y="20" width="100" height="100" rx="45" fill="#7af0ff55" stroke="#fff" stroke-width="4"/><circle cx="80" cy="70" r="14" fill="#ff7ad9"/><circle cx="115" cy="60" r="12" fill="#ffd86b"/><circle cx="105" cy="92" r="13" fill="#8dff8a"/><circle cx="78" cy="98" r="10" fill="#c56bff"/><rect x="45" y="110" width="110" height="70" rx="14" fill="#ff5a8a"/><circle cx="100" cy="142" r="15" fill="#ffd86b" stroke="#a40" stroke-width="3"/><rect x="88" y="165" width="24" height="10" rx="3" fill="#311"/>`}

// ---------- ALUMNI ----------
function alumniUpdate(a){const r=rng(a.id*31+Math.floor((S.gameNow-a.left)/DAY));
  const days=Math.floor((S.gameNow-a.left)/DAY);
  const ev=["just sent you a postcard from a pink ring-planet 💌","made a new best friend named "+pick(r,SPECIES).name+" 👯","is redecorating with moon-crystals 💎","learned to cook nebula noodles 🍜","won a zero-G dance-off 🕺","is napping in a hammock between two moons 😴","adopted a tiny pet asteroid 🪨","says it misses your belly rubs 🥹","planted a garden of glow-flowers 🌸","is training for the Comet Marathon 🏃"];
  return {days,txt:pick(r,ev)};}

function particle(t,x,y,cls,vars,life){const e=document.createElement("div");e.className="pt "+(cls||"");if(t)e.innerHTML=t;e.style.left=x+"px";e.style.top=y+"px";

const IDLES=["i-blink","i-lookL","i-lookR","i-stretch","i-sit","i-bounce","i-spin"];
function loop(){requestAnimationFrame(loop);const wk=$("walker");if(tab!=="home"||!wk)return;const p=S.pets[cur];if(!p)return;
  const t=now(),st=wk.parentElement,lim=Math.max(0,(st.clientWidth-170)/2-6),m=mood(p),pb=$("petbox");
  if(!W._dt)W._dt=t;const dt=Math.min(.05,(t-W._dt)/1000);W._dt=t;let y=0;
  if(p.stage===0){W.x=0}
  else if(p.sleeping){if(t>W.nextZ){W.nextZ=t+1400;const c=petC(.35);particle(pick(Math.random,["Z","z","Z"]),c.x+20,c.y,"zz",null,2500)}}
  else if(!mode&&t>W.hold){
    if(t>W.nextBlink&&pb&&!W.idle){W.nextBlink=t+2200+Math.random()*3000;pb.classList.add("i-blink");setTimeout(()=>pb.classList.remove("i-blink"),140)}
    if(W.state==="walk"){const sp=(m==="happy"?65:m==="sick"?22:18)*(p.stage===1?1.25:1),d=W.tx-W.x,mv=Math.sign(d)*Math.min(Math.abs(d),sp*dt);
      W.x+=mv;W.walkD+=Math.abs(mv);W.face=d<0?-1:1;
      y=m==="happy"?-Math.abs(Math.sin(W.walkD/14))*14:m==="sick"?Math.sin(W.walkD/8)*2:-Math.abs(Math.sin(W.walkD/20))*3;
      if(Math.abs(d)<1){W.state="idle";W.until=t+700+Math.random()*2200}}
    else if(W.idle&&t>W.idleEnd){pb&&pb.classList.remove(W.idle);W.idle=null;W.until=t+500+Math.random()*1500}
    else if(!W.idle&&t>W.until){
      if(Math.random()<(m==="happy"?.55:.35)){W.state="walk";W.tx=(Math.random()*2-1)*lim;W.walkD=0}
      else{let pool=m==="happy"?IDLES:["i-lookL","i-lookR","i-sit","i-stretch"];W.idle=pick(Math.random,pool);
        W.idleEnd=t+({"i-bounce":1400,"i-stretch":1400,"i-spin":800,"i-sit":2000}[W.idle]||1200);pb&&pb.classList.add(W.idle);
        if(W.idle==="i-lookL")W.face=-1;if(W.idle==="i-lookR")W.face=1}}}
  W.x=Math.max(-lim,Math.min(lim,W.x));

    if(st===0||st===4)tone(N(PROG[bar][0]-12),B*3.5,{type:"sine",v:.05,dest:MuG,at,att:.1});

  while(list.length<3){const q=pick(r,pool);pool.splice(pool.indexOf(q),1);if(!list.some(x=>x.t===q.t))list.push(q)}
  S.quests={day:d,list:list.map(q=>{const dec=r()<.3?pick(r,DECOR.filter(x=>x.c<=25)).id:null;return{t:q.t,g:q.g,d:q.d,e:q.e,p:0,claimed:false,rs:dec?3:6+Math.floor(r()*7),rd:dec}})};save()}

const BREED_COST=30,BREED_CD=12*3600e3;let NS=[];
function mixHex(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const x=p(a),y=p(b);return"#"+x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,"0")).join("")}
function bondOK(a){return a.q>=70||(a.hugs||0)>=3}
function parentsList(){const o=[];S.pets.forEach(p=>{if(p.stage===4)o.push({ref:"p"+p.id,o:p,n:p.nick,sp:p.sp,v:p.variant,where:"Nest"})});
  S.alumni.forEach(a=>{if(bondOK(a))o.push({ref:"a"+a.id,o:a,n:a.nick,sp:a.sp,v:a.variant,where:"Alumni"})});return o}
function nurseryHTML(){const L=parentsList();const sel=NS.map(r=>L.find(x=>x.ref===r)).filter(Boolean);NS=sel.map(x=>x.ref);
  return`<div class="card nursery"><h3>💞 Star Nursery</h3><div class="muted">Pair two adults (nest pets at Adult stage, or alumni with a strong bond: care score 70+ or 3+ hugs). The egg blends both parents' colors & personalities — sometimes a rare <b>hybrid</b>! ${BREED_COST}⭐ · each parent rests 12h after.</div>
  <div class="row" style="flex-wrap:wrap;gap:6px;margin-top:8px">${L.length?L.map(x=>{const cd=(x.o.pairCd||0)-Date.now();return`<button class="pchip ${NS.includes(x.ref)?"on":""}" ${cd>0?"disabled":""} onclick="selP('${x.ref}')">${petSVG(SPECIES[x.sp],4,x.v,"happy")}<span>${x.n}<small>${cd>0?"rests "+fmtDur(cd):x.where}</small></span></button>`}).join(""):'<span class="muted">No adults yet — raise a pet to Adult, or bond with alumni (hugs!).</span>'}</div>
  ${sel.length===2?`<div class="row" style="justify-content:center;margin-top:8px">${petSVG(SPECIES[sel[0].sp],4,sel[0].v,"happy").replace("<svg",'<svg style="width:60px"')}<b style="font-size:26px">💞</b>${petSVG(SPECIES[sel[1].sp],4,sel[1].v,"happy").replace("<svg",'<svg style="width:60px"')}</div><div class="muted" style="text-align:center">Hybrid chance: ${hyChance(sel[0],sel[1])}%</div>`:""}
  <button class="btn gold" style="width:100%;margin-top:8px" ${sel.length===2?"":"disabled"} onclick="breed()">💫 Pair ${sel.length===2?sel[0].n+" + "+sel[1].n:"(pick 2)"} · ${BREED_COST}⭐</button></div>`}
function hyChance(a,b){return(a.sp!==b.sp?25:10)+(a.v==="radiant"?10:0)+(b.v==="radiant"?10:0)}
function selP(r){const i=NS.indexOf(r);if(i>=0)NS.splice(i,1);else{if(NS.length>=2)NS.shift();NS.push(r)}render()}
function breed(){const L=parentsList(),[A,B]=NS.map(r=>L.find(x=>x.ref===r));if(!A||!B)return;
  if(S.stars<BREED_COST){toast("Not enough stars ⭐");sfx("miss");return}if(S.pets.length>=S.maxPets&&S.eggBank.length>=30){toast("No room for an egg!");return}
  const sA=SPECIES[A.sp],sB=SPECIES[B.sp],hy=Math.random()*100<hyChance(A,B),base=Math.random()<.5?sA:sB,oth=base===sA?sB:sA,ord=["common","rare","epic","legendary"];
  let rar=ord[Math.max(ord.indexOf(sA.rarity),ord.indexOf(sB.rarity))];if(hy&&rar!=="legendary"&&Math.random()<.5)rar=ord[ord.indexOf(rar)+1];
  const half=s=>s.name.slice(0,Math.ceil(s.name.length/2)),tail=s=>s.name.slice(Math.floor(s.name.length/2)).toLowerCase();
  const sp=Object.assign({},base,{id:SPECIES.length,rarity:rar,c1:mixHex(sA.c1,sB.c1,.5),c2:Math.random()<.5?sA.c2:sB.c2,life:Math.round((sA.life+sB.life)/2),hybrid:hy,parents:[A.n,B.n],
    name:hy?half(base)+tail(oth):base.name,flavor:hy?`A rare cosmic hybrid of ${sA.name} and ${sB.name}!`:`Child of ${A.n} & ${B.n}. Takes after its ${base.name} side.`});
  if(hy)Object.assign(sp,{ant:oth.ant,tail:oth.tail,ears:oth.ears,marks:oth.marks,eyeStyle:"sparkle"});delete sp._new;
  SPECIES.push(sp);S.hybrids.push(sp);S.stars-=BREED_COST;A.o.pairCd=B.o.pairCd=Date.now()+BREED_CD;
  const p=newPet(sp.id);const ta=(A.o.traits||[])[0],tb=(B.o.traits||[])[0];p.traits=[...new Set([ta,tb].filter(Boolean))];if(!p.traits.length)p.traits=[pick(Math.random,TRAIT_KEYS)];p.parents=[A.n,B.n];
  let where;if(S.pets.length<S.maxPets){S.pets.push(p);where="nest"}else{S.eggBank.push(sp.id);where="egg storage"}
  S.stats3.breed++;if(hy)S.stats3.hybrid++;NS=[];save();sfx("giggle");
  modal(`<h2>💞 Star Nursery</h2><div class="row" style="justify-content:center">${petSVG(sA,4,A.v,"happy","").replace("<svg",'<svg class="nl" style="width:90px"')}${petSVG(sB,4,B.v,"happy").replace("<svg",'<svg class="nr" style="width:90px"')}</div><div id="nh" style="font-size:30px">💖 ✨ 💖</div>`);
  setTimeout(()=>{sfx(hy?"evolve":"hatch");modal(`<h2>${hy?"🧬 A rare hybrid egg!":"🥚 A new egg!"}</h2>${petSVG(sp,0,null,"happy","pop").replace("<svg",'<svg style="width:120px"')}<p><span class="tag t-${sp.rarity}">${sp.rarity}</span> <b>${sp.name}</b><br><span class="muted">${sp.flavor}</span></p><p class="muted">Inherits: ${p.traits.map(t=>TRAITS[t].e+" "+t).join(", ")} · sent to ${where}${where==="nest"?" · hatches in 1 minute":""}</p><button class="btn gold" onclick="closeM();tab='home';cur=S.pets.length-1;render()">See egg</button>`);checkAch()},1600)}
const _viewDex4=viewDex;viewDex=function(){const h=SPECIES.splice(BASE_N);try{return _viewDex4()}finally{SPECIES.push(...h)}};
const _roll0=null;
const _traitHTML=traitHTML;traitHTML=function(p){const sp=SPECIES[p.sp];let x="";if(sp.hybrid)x+=`<span class="chip hyb">🧬 Hybrid</span>`;if(p.parents)x+=`<span class="chip">👪 ${p.parents.join(" & ")}</span>`;return(x?`<div class="traits">${x}</div>`:"")+_traitHTML(p)};
// ---------- POSTCARDS ----------
const CARDTXT=["Wish you were here! The rings of Zorb are sparkly this time of year.","I made a sandcastle on a comet. It melted. Worth it!","Started a little garden. The glow-berries remind me of you.","Got a new job sorting stardust by color. I'm the best at pink.","Saw a meteor shower last night and made a wish about you 💫","I finally learned to cook nebula noodles without burning them!","My neighbor is a very polite black hole. He hums at night.","Went zero-G swimming in a gas giant. 10/10 would float again.","I still sleep with the blanket from the nest. Don't tell anyone.","Found a shiny moon-pebble and thought: they'd love this!"];
const SKIES=["#3b1450,#c0487a","#0f2a5e,#2fb3a5","#2b1a5e,#ff9a5a","#123,#5a3fbf","#401a3a,#ffb36b"];
function mailTick(){const t=Date.now();let n=0;S.alumni.forEach(a=>{if(!a.nextCard){a.nextCard=t+(2+Math.random()*8)*60000;return}if(t<a.nextCard)return;
  a.nextCard=t+(18+Math.random()*12)*3600e3;const r=Math.random(),gift=r<.25?{s:2+Math.floor(Math.random()*5)}:r<.4?{d:pick(Math.random,DECOR.filter(x=>x.c<=25)).id}:null;
  S.mail.unshift({id:S.mailN++,aid:a.id,nick:a.nick,sp:a.sp,v:a.variant,t,txt:pick(Math.random,CARDTXT),sky:pick(Math.random,SKIES),gift,read:false,claimed:false});n++});
  if(S.mail.length>40)S.mail.length=40;if(n){save();toast(`📬 ${n>1?n+" postcards":"A postcard"} from your alumni!`);sfx("coin");navBadge();if(tab==="alumni")render()}}
function mailbox(){modal(`<h2>📬 Mailbox</h2>${S.mail.length?S.mail.map(m=>`<div class="alum" onclick="readCard(${m.id})" style="${m.read?"opacity:.6":""}">${petSVG(SPECIES[m.sp],4,m.v,"happy")}<div style="text-align:left"><b>${m.read?"":"🔵 "}From ${m.nick}</b><div class="muted">${new Date(m.t).toLocaleDateString()} ${m.gift&&!m.claimed?"· 🎁 gift inside!":""}</div></div></div>`).join(""):'<p class="muted">No postcards yet. Pets that move out write home about once a day.</p>'}<button class="btn ghost" onclick="closeM()">Close</button>`)}
function readCard(id){const m=S.mail.find(x=>x.id===id);if(!m)return;if(!m.read){m.read=true;S.stats3.cards++}let g="";
  if(m.gift&&!m.claimed){m.claimed=true;S.stats3.gifts++;if(m.gift.s){S.stars+=m.gift.s;g=`🎁 +${m.gift.s}⭐`}else{S.decor.owned[m.gift.d]=(S.decor.owned[m.gift.d]||0)+1;g=`🎁 ${DI[m.gift.d].e||"🧶"} ${DI[m.gift.d].n} (in decor storage)`}sfx("coin")}else sfx("tap");save();navBadge();
  modal(`<div class="postcard" style="background:linear-gradient(135deg,${m.sky})">${starsHTML(15)}<div class="stamp">${petSVG(SPECIES[m.sp],4,m.v,"happy")}</div><div class="pctext">Dear friend,<br>${m.txt}<br><br>Love, ${m.nick} 💌</div></div>${g?`<div class="card" style="color:#ffd86b"><b>${g}</b></div>`:""}<div class="row" style="justify-content:center"><button class="btn" onclick="mailbox()">‹ Mailbox</button><button class="btn ghost" onclick="closeM()">Close</button></div>`)}
const _viewAlumni4=viewAlumni;viewAlumni=function(){const u=S.mail.filter(m=>!m.read).length;return`<button class="card mailbtn" onclick="mailbox()">📬 <b>Mailbox</b> ${u?`<span class="tag" style="background:#ff4d6d">${u} new</span>`:`<span class="muted">${S.mail.length} postcards</span>`}<span class="muted" style="margin-left:auto">Alumni write home ~daily</span></button>`+_viewAlumni4()};
const _hug4=hug;hug=function(id){const a=S.alumni.find(x=>x.id===id),d0=a&&a.hugDay;_hug4(id);if(a&&a.hugDay!==d0){a.hugs=(a.hugs||0)+1;save()}};
const _moveOut4=moveOut;moveOut=function(){_moveOut4();const a=S.alumni[0];if(a&&!a.nextCard){a.nextCard=Date.now()+(2+Math.random()*8)*60000;save()}checkAch()};
// ---------- HIGH SCORES ----------
const _endGame4=endGame;endGame=function(){if(!G||G.over)return;const id=G.def.id,sc=G.score,prev=S.hs[id]||0;S.stats3.gp[id]=1;if(sc>=G.def.max)S.stats3.superstar=1;
  _endGame4();if(sc>prev){S.hs[id]=sc;save();if(prev>0||sc>0)setTimeout(()=>{const b=document.querySelector("#game .big");if(b)b.insertAdjacentHTML("afterend",`<div style="color:#ffd86b;font-weight:800">🏆 NEW HIGH SCORE!</div>`)},470)}
  else setTimeout(()=>{const b=document.querySelector("#game .big");if(b)b.insertAdjacentHTML("afterend",`<div class="muted">Best: ${prev}</div>`)},470);checkAch()};
const _openPicker4=openPicker;openPicker=function(){_openPicker4();document.querySelectorAll("#game .pickc").forEach((b,i)=>{const g=GAMES[i],h=S.hs[g.id];b.insertAdjacentHTML("beforeend",`<span class="hs">🏆<br>${h!=null?h:"–"}</span>`)})};
// ---------- ACHIEVEMENTS ----------
const allP=()=>S.pets.concat(S.alumni),varN=v=>allP().filter(p=>p.variant===v).length,dexN=()=>Object.keys(S.dex).length,decN=()=>S.decor.placed.length;
const ACH=[
 {id:"hatch1",e:"🐣",n:"Hello, World",d:"Hatch your first pet",r:5,c:()=>S.stats3.hatch>=1},
 {id:"hatch10",e:"🥚",n:"Egg Whisperer",d:"Hatch 10 pets",r:20,c:()=>S.stats3.hatch>=10},
 {id:"rad1",e:"🌟",n:"Radiant Raiser",d:"Raise a pet to the Radiant form",r:10,c:()=>varN("radiant")>=1},
 {id:"rad5",e:"💫",n:"Pure Starlight",d:"Raise 5 Radiant pets",r:40,c:()=>varN("radiant")>=5},
 {id:"forms",e:"🌈",n:"Every Path",d:"Raise a Radiant, a Classic and a Wild pet",r:20,c:()=>["radiant","classic","wild"].every(v=>varN(v)>0)},
 {id:"dex10",e:"📖",n:"Stargazer",d:"Discover 10 species",r:10,c:()=>dexN()>=10},
 {id:"dex25",e:"🔭",n:"Astronomer",d:"Discover 25 species",r:25,c:()=>dexN()>=25},
 {id:"dex45",e:"🌌",n:"Cosmic Cartographer",d:"Complete the Star-Dex (45)",r:100,c:()=>dexN()>=BASE_N},
 {id:"leg",e:"👑",n:"Legend Found",d:"Summon a legendary egg",r:15,c:()=>SPECIES.some(s=>s.id<BASE_N&&s.rarity==="legendary"&&S.dex[s.id])},
 {id:"pull50",e:"🎰",n:"Gacha Fanatic",d:"Summon 50 eggs",r:25,c:()=>S.pulls>=50},
 {id:"grad1",e:"🚀",n:"Leaving the Nest",d:"Help a pet move out",r:10,c:()=>S.alumni.length>=1},
 {id:"grad10",e:"🎓",n:"Proud Parent",d:"10 pets have moved out",r:40,c:()=>S.alumni.length>=10},
 {id:"allgames",e:"🎮",n:"Game Night",d:"Play all 5 minigames",r:10,c:()=>GAMES.every(g=>S.stats3.gp[g.id])},
 {id:"super",e:"🏆",n:"Superstar",d:"Reach the max score in any minigame",r:15,c:()=>!!S.stats3.superstar},
 {id:"dec5",e:"🛋️",n:"Interior Designer",d:"Have 5 decorations placed",r:10,c:()=>decN()>=5},
 {id:"dec12",e:"🏰",n:"Space Palace",d:"Have 12 decorations placed",r:30,c:()=>decN()>=12},
 {id:"walls",e:"🖼️",n:"Wallpaper Collector",d:"Own 3 wallpapers",r:15,c:()=>Object.keys(S.decor.walls).length>=3},
 {id:"str3",e:"🔥",n:"On a Roll",d:"3-day login streak",r:10,c:()=>S.login.streak>=3},
 {id:"str7",e:"📅",n:"Devoted Keeper",d:"7-day login streak",r:30,c:()=>S.login.streak>=7},
 {id:"q10",e:"📜",n:"Quest Hero",d:"Claim 10 daily quests",r:20,c:()=>S.stats3.qc>=10},
 {id:"breed1",e:"💞",n:"Matchmaker",d:"Pair two pets at the Star Nursery",r:15,c:()=>S.stats3.breed>=1},
 {id:"hyb1",e:"🧬",n:"Mad Scientist",d:"Create a hybrid egg",r:25,c:()=>S.stats3.hybrid>=1},
 {id:"card5",e:"💌",n:"Pen Pal",d:"Read 5 postcards from alumni",r:15,c:()=>S.stats3.cards>=5},
 {id:"favs",e:"❤️",n:"Best Friends",d:"Discover a pet's favorite food AND game",r:10,c:()=>allP().some(p=>p.knowFood&&p.knowGame)}];
let achBusy=false;
function checkAch(){if(!S||!S.ach||achBusy)return;achBusy=true;try{const nw=ACH.filter(a=>!S.ach[a.id]&&a.c());nw.forEach((a,i)=>{S.ach[a.id]=Date.now();S.stars+=a.r;
  setTimeout(()=>{toast(`🏅 Achievement: ${a.e} ${a.n}! +${a.r}⭐`);sfx("reveal","epic");const s=$("stars");if(s)s.textContent=S.stars},400+i*2100)});if(nw.length)save()}finally{achBusy=false}}
function viewBadges(){const n=ACH.filter(a=>S.ach[a.id]).length;return`<div class="card"><h3>🏅 Badges</h3><div class="muted">${n}/${ACH.length} unlocked · tap a badge for details</div><div class="bar"><i style="width:${n/ACH.length*100}%;background:#ffd86b"></i></div></div>
  <div class="bgrid">${ACH.map(a=>{const u=S.ach[a.id];return`<button class="badge ${u?"on":""}" onclick="toast('${a.e} ${a.n}: ${a.d} (+${a.r}⭐)${u?" ✓":""}')"><b>${u?a.e:"🔒"}</b><span>${a.n}</span><small>${u?"✓ Unlocked":a.r+"⭐"}</small></button>`}).join("")}</div>`}
// counters
const _checkStage4=checkStage;checkStage=function(p){const o=p.stage;_checkStage4(p);if(o===0&&p.stage>=1)S.stats3.hatch++};
const _claimQ4=claimQ;claimQ=function(i){const q=S.quests.list[i],was=q&&q.claimed;_claimQ4(i);if(q&&!was&&q.claimed){S.stats3.qc++;save();checkAch()}};
setInterval(()=>{mailTick();checkAch()},5000);setTimeout(()=>{mailTick();checkAch()},1500);

load();tick();save();render();requestAnimationFrame(loop);
setInterval(()=>{tick();save();flush();if(busy){$("stars").textContent=S.stars;return}if($("modal").style.display!=="flex"&&!document.activeElement.matches?.("input"))refresh()},1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){tick();render()}});
</script></body></html>
